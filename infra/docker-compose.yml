services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hedgefund}
      POSTGRES_USER: ${POSTGRES_USER:-hedgefund}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hedgefund}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hedgefund}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
      target: dev
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py runserver 0.0.0.0:8000"

  worker:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
      target: dev
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ../backend:/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A hedgefund worker -l info

  beat:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
      target: dev
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ../backend:/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A hedgefund beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
      target: dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - web

volumes:
  pgdata:
