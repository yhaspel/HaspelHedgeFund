services:
  db:
    image: postgres:16
    command: postgres -c max_connections=400
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hedgefund}
      POSTGRES_USER: ${POSTGRES_USER:-hedgefund}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hedgefund}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published dev ports (db, web, frontend) bind to 127.0.0.1: reachable from
    # this machine only. Containers talk to each other over the compose network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hedgefund}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # No host port: the app containers reach Redis at redis:6379 over the compose
    # network, and a native Redis on the host often already holds 127.0.0.1:6379.
    # For a shell: `docker compose exec redis redis-cli`.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
      target: dev
    env_file: ../.env
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      # P4-OFF: offline mode + local-model host. Works via `.env` OR a
      # shell-prefixed `OFFLINE_MODE=1 docker compose up`. Ollama runs on the
      # HOST (infra/ollama-start.sh), so containers reach it at
      # host.docker.internal, not localhost.
      OFFLINE_MODE: ${OFFLINE_MODE:-0}
      OFFLINE_LLM_MODEL: ${OFFLINE_LLM_MODEL:-qwen2.5:7b}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/app
    ports:
      - "127.0.0.1:8811:8811"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py runserver 0.0.0.0:8811"

  worker:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
      target: dev
    env_file: ../.env
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      OFFLINE_MODE: ${OFFLINE_MODE:-0}
      OFFLINE_LLM_MODEL: ${OFFLINE_LLM_MODEL:-qwen2.5:7b}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A hedgefund worker -l info --concurrency=8

  # Celery beat is opt-in behind the `scheduler` compose profile: infra/up.sh and a
  # plain `docker compose up` never start a local scheduler, so a dev stack can't
  # duplicate the scheduled jobs (emails, LLM runs, data pulls) of an instance
  # that already runs its own beat. Start it deliberately with:
  #     docker compose --profile scheduler up -d --build
  beat:
    profiles: ["scheduler"]
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
      target: dev
    env_file: ../.env
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      OFFLINE_MODE: ${OFFLINE_MODE:-0}
      OFFLINE_LLM_MODEL: ${OFFLINE_LLM_MODEL:-qwen2.5:7b}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A hedgefund beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
      target: dev
    environment:
      # pnpm's deps-status-check wants TTY confirmation to purge node_modules
      # when the host lockfile drifts from the named volume; CI=true makes it
      # non-interactive so `docker compose up` brings the service up cleanly.
      CI: "true"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:4111:4111"
    depends_on:
      - web

  # P3a-2: IBKR Client Portal Gateway sidecar. Only needed by users who
  # connect an IBKR account; Demo / TradeStation / Alpaca users never run
  # this. See `guides/ibkr-gateway.md` for the one-time `.zip` download
  # the user must drop into `infra/ibkr-gateway/dist/` before this image
  # can build. ADR 0011 §1.
  #
  # The host port mapping is `127.0.0.1:5000:5000` deliberately — the
  # user's browser needs `https://localhost:5000` for the one-time
  # interactive 2FA login, but binding to loopback keeps the gateway
  # off any externally-routable interface. The Django app reaches it
  # over the compose network at `https://ibkr-gateway:5000`.
  #
  # P3a-2 is DEFERRED, so this service sits behind the `ibkr` compose profile:
  # a plain `docker compose up` skips it entirely (no build, nothing to fail).
  # Opt in only once you've dropped the BYO `.zip` and want IBKR:
  #     docker compose --profile ibkr up
  # The Dockerfile is also tolerant of a missing `.zip` (logs + placeholder)
  # so even an explicit `--profile ibkr` build never hard-fails.
  ibkr-gateway:
    profiles: ["ibkr"]
    build:
      context: ./ibkr-gateway
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

volumes:
  pgdata:
