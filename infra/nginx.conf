# SPA-aware nginx config for the built Angular frontend (P4-OFF WS-2.7).
#
# The default nginx config 404s deep-link refreshes (e.g. /runs/42) because the
# SPA routes only exist client-side. `try_files ... /index.html` serves the shell
# for any unknown path so the router can take over. index.html and ngsw.json are
# served no-cache so a new deploy is picked up immediately; hashed assets keep
# nginx's default caching and ngsw revalidates them by content hash.
server {
  listen 80;
  root /usr/share/nginx/html;

  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /ngsw.json  { add_header Cache-Control "no-cache"; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
