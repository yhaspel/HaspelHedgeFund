name: frontend-ci

# CI policy: every push (any branch) and PRs. See backend-ci.yml for the
# decision trail and for why `pull_request` is deliberately not path-filtered
# (`build-test` is a required check on `main`; a workflow that never starts
# reports nothing, which blocks the PR forever rather than passing it).
on:
  push:
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:inline-styles
      - run: pnpm check:tokens
      - run: pnpm check:no-native-dialogs
      - run: pnpm test --watch=false
      - run: pnpm build
