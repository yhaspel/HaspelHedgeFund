name: backend-ci

# CI policy: run on every push (any branch) and on pull requests. See
# phase-00-foundations review for the decision trail (plan called for
# every-push, original workflow filtered to main; this resolves to
# every-push + PR).
#
# The `push` trigger stays path-filtered so docs-only edits skip CI. The
# `pull_request` trigger is deliberately NOT filtered: `test` is a required
# status check on `main`, and a path-filtered workflow that never starts
# produces no check-run at all — which branch protection reads as "still
# waiting", not "skipped". That deadlocked every frontend-only PR (and the
# mirror-image filter in frontend-ci deadlocked every backend-only one), so
# only PRs touching BOTH halves could merge. Always reporting on PRs costs a
# short no-op run and keeps all three required contexts satisfiable.
on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install deps
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
