name: backend-ci

# CI policy: run on every push (any branch) and on pull requests, filtered by
# paths so docs-only edits skip CI. See phase-00-foundations review for the
# decision trail (plan called for every-push, original workflow filtered to
# main; this resolves to every-push + PR).
on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install deps
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
