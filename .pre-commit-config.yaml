repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/.*\.(ts|js|html|css|json|md)$

  - repo: local
    hooks:
      - id: frontend-inline-styles
        name: frontend inline-style gate
        entry: bash -c 'cd frontend && pnpm check:inline-styles'
        language: system
        files: ^frontend/src/.*\.(ts|html)$
        pass_filenames: false
      - id: frontend-tokens
        name: frontend phantom-token gate
        entry: bash -c 'cd frontend && pnpm check:tokens'
        language: system
        files: ^frontend/src/.*\.(ts|css|html)$
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
