[project]
name = "hedgefund-backend"
version = "0.1.0"
description = "HaspelHedgeFund Django backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "django-celery-beat>=2.7",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.0",
    "python-json-logger>=2.0",
    "gunicorn>=22.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "cryptography>=42.0",
    "alpaca-py>=0.30",
    "croniter>=3.0",
    "cron-descriptor>=1.4",
    "tzdata>=2024.1",
    "langdetect>=1.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    "djangorestframework-stubs>=3.15",
    "vcrpy>=6.0",
    "pytest-vcr>=1.0",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hedgefund.settings.test"
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "live_llm: opt-in tests that call a real LLM (set RUN_LIVE_LLM_TESTS=1)",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "hedgefund.settings.dev"
